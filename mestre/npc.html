<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPCs • Painel do Mestre - RPG VTT</title>

    <!-- Tailwind CSS (CDN) e as cores/fontes do painel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/mestre/JS/tailwind-config.js"></script>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Regras compartilhadas com a ficha (catálogo de perícias, modificadores, escape de HTML...) -->
    <script src="/JS/regras.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/mestre/CSS/mestre.css">
</head>

<body
    class="bg-void text-slate-200 font-sans min-h-screen flex flex-col pb-10 selection:bg-amberGold-600 selection:text-white">

    <!-- Menu, token e conexão: montados pelo comum.js -->
    <header id="mestre-cabecalho" data-pagina="npc"></header>

    <main class="max-w-7xl mx-auto px-6 mt-6 flex-1 w-full space-y-6">

        <div class="flex flex-wrap justify-between items-center gap-3 pb-2 border-b border-dungeon-800">
            <h2 class="font-cinzel text-lg font-bold text-amberGold-400 flex items-center gap-2">
                <i class="fa-solid fa-masks-theater"></i> NPCs
            </h2>
            <span id="npc-contagem" class="text-[11px] font-mono text-slate-500"></span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            <!-- Lista de NPCs: cartões compactos com busca -->
            <section id="npc-lista" class="lg:col-span-2 bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-3">
                <div class="flex gap-2">
                    <input id="npc-busca" type="text" maxlength="80" placeholder="Buscar por nome, papel, lore ou notas…"
                        class="flex-1 bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1 text-xs font-mono">
                    <button id="npc-novo" type="button" class="px-3 py-1.5 rounded text-xs font-mono bg-amberGold-600 text-white">+ Novo NPC</button>
                </div>
                <div id="npc-cartoes" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </section>

            <!-- Editor (formulário resumido) -->
            <section id="npc-editor" class="hidden bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-2">
                <h3 id="np-titulo" class="font-cinzel font-bold text-amber-200 text-sm"></h3>
                <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                    <label class="col-span-2">Nome<input id="np-nome" maxlength="80" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <label class="col-span-2">Papel<input id="np-papel" maxlength="80" placeholder="Ferreiro, guarda, estalajadeira…" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <label class="col-span-2">Retrato (URL http/https ou caminho /...)<input id="np-retrato" maxlength="2000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <label class="col-span-2">Mini lore <span id="np-lore-contador" class="text-slate-500"></span>
                        <textarea id="np-lore" rows="4" maxlength="500" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                    <label>HP atual<input id="np-hp-atual" type="number" min="0" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <label>HP máximo<input id="np-hp-max" type="number" min="0" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <div class="col-span-2 grid grid-cols-6 gap-1"><label>FOR<input id="np-attr-FOR" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>DES<input id="np-attr-DES" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>INT<input id="np-attr-INT" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>SAB<input id="np-attr-SAB" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>PRE<input id="np-attr-PRE" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>VON<input id="np-attr-VON" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label></div>
                    <label class="col-span-2">Notas<textarea id="np-notas" rows="3" maxlength="2000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                    <label class="col-span-2 text-rose-300"><i class="fa-solid fa-lock"></i> Segredo do mestre (nunca aparece para jogadores)
                        <textarea id="np-segredo" rows="3" maxlength="2000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                </div>
                <div class="flex gap-2 pt-1">
                    <button id="np-salvar" type="button" class="px-3 py-1.5 rounded text-xs font-mono bg-amberGold-600 text-white">Salvar</button>
                    <button id="np-cancelar" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Cancelar</button>
                </div>
            </section>
        </div>

    </main>

    <script src="/mestre/JS/comum.js"></script>
    <script src="/mestre/JS/npc.js"></script>
</body>

</html>
