<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inimigos • Painel do Mestre - RPG VTT</title>

    <!-- Tailwind CSS (CDN) e as cores/fontes do painel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/mestre/JS/tailwind-config.js"></script>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Regras compartilhadas com a ficha (catálogo de perícias, modificadores, escape de HTML...) -->
    <script src="/JS/regras.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/mestre/CSS/mestre.css">
</head>

<body
    class="bg-void text-slate-200 font-sans min-h-screen flex flex-col pb-10 selection:bg-amberGold-600 selection:text-white">

    <!-- Menu, token e conexão: montados pelo comum.js -->
    <header id="mestre-cabecalho" data-pagina="inimigos"></header>

    <main class="max-w-7xl mx-auto px-6 mt-6 flex-1 w-full space-y-6">

        <div class="flex flex-wrap justify-between items-center gap-3 pb-2 border-b border-dungeon-800">
            <h2 class="font-cinzel text-lg font-bold text-amberGold-400 flex items-center gap-2"><i class="fa-solid fa-skull"></i> Inimigos</h2>
            <div class="flex gap-2" role="tablist">
                <button id="ini-aba-biblioteca" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Biblioteca</button>
                <button id="ini-aba-batalha" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Batalha</button>
            </div>
        </div>

        <!-- Biblioteca de inimigos -->
        <div id="ini-biblioteca" class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            <section class="lg:col-span-2 bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-3">
                <div class="flex gap-2">
                    <input id="ini-busca" type="text" maxlength="80" placeholder="Buscar inimigo…" class="flex-1 bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1 text-xs font-mono">
                    <button id="ini-novo" type="button" class="px-3 py-1.5 rounded text-xs font-mono bg-amberGold-600 text-white">+ Novo inimigo</button>
                </div>
                <div id="ini-cartoes" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </section>
            <section id="ini-editor" class="hidden bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-2">
                <h3 id="in-titulo" class="font-cinzel font-bold text-amber-200 text-sm"></h3>
                <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                    <label class="col-span-2">Nome<input id="in-nome" maxlength="80" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <label class="col-span-2">Imagem (URL http/https ou caminho /...)<input id="in-imagem" maxlength="2000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <label>HP máximo<input id="in-hpMax" type="number" min="1" value="10" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                    <div></div>
                    <div class="col-span-2 grid grid-cols-6 gap-1"><label>FOR<input id="in-attr-FOR" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>DES<input id="in-attr-DES" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>INT<input id="in-attr-INT" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>SAB<input id="in-attr-SAB" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>PRE<input id="in-attr-PRE" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label><label>VON<input id="in-attr-VON" type="number" min="0" max="999" placeholder="—" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label></div>
                    <div class="col-span-2">
                        <div class="flex justify-between items-center"><span>Ataques (até 20)</span><button id="in-add-ataque" type="button" class="px-2 border border-dungeon-700 rounded">+</button></div>
                        <div id="in-ataques" class="space-y-1 mt-1"></div>
                    </div>
                    <div class="col-span-2">
                        <div class="flex justify-between items-center"><span>Habilidades (até 20)</span><button id="in-add-habilidade" type="button" class="px-2 border border-dungeon-700 rounded">+</button></div>
                        <div id="in-habilidades" class="space-y-1 mt-1"></div>
                    </div>
                    <label class="col-span-2">Nota do mestre<textarea id="in-nota" rows="3" maxlength="2000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                </div>
                <div class="flex gap-2 pt-1">
                    <button id="in-salvar" type="button" class="px-3 py-1.5 rounded text-xs font-mono bg-amberGold-600 text-white">Salvar</button>
                    <button id="in-cancelar" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Cancelar</button>
                </div>
            </section>
        </div>

        <!-- Batalha em andamento -->
        <section id="ini-batalha" class="hidden bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <span id="ini-batalha-resumo" class="text-xs font-mono text-slate-400"></span>
                <button id="ini-limpar" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700 text-rose-300">Limpar batalha</button>
            </div>
            <div id="ini-combatentes" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        </section>

    </main>

    <script src="/mestre/JS/comum.js"></script>
    <script src="/mestre/JS/inimigos.js"></script>
</body>

</html>
