<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilidades e Magias • Painel do Mestre - RPG VTT</title>

    <!-- Tailwind CSS (CDN) e as cores/fontes do painel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/mestre/JS/tailwind-config.js"></script>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Regras compartilhadas com a ficha (catálogo de perícias, modificadores, escape de HTML...) -->
    <script src="/JS/regras.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/mestre/CSS/mestre.css">
</head>

<body
    class="bg-void text-slate-200 font-sans min-h-screen flex flex-col pb-10 selection:bg-amberGold-600 selection:text-white">

    <!-- Menu, token e conexão: montados pelo comum.js -->
    <header id="mestre-cabecalho" data-pagina="habilidades-magias"></header>

    <main class="max-w-7xl mx-auto px-6 mt-6 flex-1 w-full space-y-6">

        <div class="flex flex-wrap justify-between items-center gap-3 pb-2 border-b border-dungeon-800">
            <h2 class="font-cinzel text-lg font-bold text-amberGold-400 flex items-center gap-2">
                <i class="fa-solid fa-wand-sparkles"></i> Habilidades e Magias
            </h2>
            <div class="flex gap-2" role="tablist">
                <button id="habmag-aba-habilidades" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Habilidades</button>
                <button id="habmag-aba-magias" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Magias</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            <!-- Catálogo: lista, busca e ações de cada entrada -->
            <section id="habmag-catalogo" class="lg:col-span-2 bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-3">
                <div class="flex gap-2">
                    <input id="habmag-busca" type="text" maxlength="80" placeholder="Buscar por nome, tipo de dano, descrição…"
                        class="flex-1 bg-dungeon-950 border border-dungeon-700 rounded px-3 py-1.5 text-xs font-mono">
                    <button id="habmag-novo" type="button" class="px-3 py-1.5 rounded text-xs font-mono bg-amberGold-600 text-white">+ Nova</button>
                </div>
                <div id="habmag-lista" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </section>

            <div class="space-y-6">
                <!-- Adicionar à ficha: escolher o personagem uma vez; cada cartão tem o botão de 1 clique -->
                <section id="habmag-enviar" class="bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-2">
                    <h3 class="font-cinzel font-bold text-amber-200 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane text-amberGold-500"></i> Adicionar à ficha
                    </h3>
                    <div class="flex gap-2">
                        <select id="habmag-personagem" class="flex-1 bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1.5 text-xs font-mono"></select>
                        <button id="habmag-atualizar-personagens" type="button" class="px-2 py-1.5 rounded text-xs border border-dungeon-700" title="Atualizar lista">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                    <p class="text-[11px] text-slate-500">Escolha o personagem e use "Adicionar" no cartão. Se ele estiver offline, a entrada espera na caixa dele e entra ao abrir a ficha.</p>
                </section>

                <!-- Editor -->
                <section id="habmag-editor" class="bg-dungeon-900 border border-dungeon-700 rounded-xl p-4 shadow-xl space-y-2 hidden">
                    <h3 id="hm-titulo" class="font-cinzel font-bold text-amber-200 text-sm"></h3>
                    <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                        <label class="col-span-2">Nome<input id="hm-nome" maxlength="80" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Ícone<input id="hm-icon" maxlength="40" placeholder="fa-fire" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Dado<input id="hm-dice" maxlength="30" placeholder="2d8+3" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Tipo de dano<input id="hm-tipoDano" maxlength="40" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Custo
                            <span class="flex gap-1">
                                <select id="hm-custo-vital" class="bg-dungeon-950 border border-dungeon-700 rounded px-1 py-1">
                                    <option value="">nenhum</option><option value="hp">Vida</option><option value="vigor">Vigor</option><option value="sanity">Sanidade</option>
                                </select>
                                <input id="hm-custo-valor" type="number" min="0" value="0" class="w-14 bg-dungeon-950 border border-dungeon-700 rounded px-1 py-1">
                            </span>
                        </label>
                        <label>Ação<input id="hm-acao" maxlength="60" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Alcance<input id="hm-alcance" maxlength="60" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Duração<input id="hm-duracao" maxlength="60" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label>Requisitos<input id="hm-requisitos" maxlength="200" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></label>
                        <label class="col-span-2">Descrição (aparece na ficha)<textarea id="hm-desc" rows="3" maxlength="2000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                        <label class="col-span-2">Descrição longa (só do mestre)<textarea id="hm-descLonga" rows="3" maxlength="4000" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                        <label class="col-span-2">Efeitos (um por linha)<textarea id="hm-efeitos" rows="3" class="w-full bg-dungeon-950 border border-dungeon-700 rounded px-2 py-1"></textarea></label>
                        <label class="col-span-2 flex items-center gap-2"><input id="hm-publico" type="checkbox"> Público (jogadores veem no catálogo da ficha; desmarcado = só por entrega)</label>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button id="hm-salvar" type="button" class="px-3 py-1.5 rounded text-xs font-mono bg-amberGold-600 text-white">Salvar</button>
                        <button id="hm-cancelar" type="button" class="px-3 py-1.5 rounded text-xs font-mono border border-dungeon-700">Cancelar</button>
                    </div>
                </section>
            </div>
        </div>

    </main>

    <script src="/mestre/JS/comum.js"></script>
    <script src="/mestre/JS/habilidades-magias.js"></script>
</body>

</html>
