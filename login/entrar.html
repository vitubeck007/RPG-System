<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Grimório RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { void: '#090b10', dungeon: { 950: '#0c0f16', 900: '#111622', 800: '#182030', 700: '#232d42' }, amberGold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' } }, fontFamily: { cinzel: ['"Cinzel"', 'serif'], sans: ['"Inter"', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-void text-slate-200 font-sans flex items-center justify-center p-4">
  <main class="w-full max-w-sm rounded-2xl border border-dungeon-700 bg-dungeon-900 p-6 shadow-2xl">
    <h1 class="mb-1 text-center font-cinzel text-xl font-black tracking-wide text-amberGold-400">GRIMÓRIO RPG</h1>
    <p class="mb-6 text-center text-xs text-slate-400">Entre para escolher seu personagem</p>

    <form id="login-form" class="space-y-3">
      <label class="block text-xs text-slate-400" for="player-name">Nome do jogador</label>
      <input id="player-name" name="nome" required maxlength="40" autocomplete="username"
        class="w-full rounded-lg border border-dungeon-700 bg-dungeon-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-amberGold-500">
      <label class="block text-xs text-slate-400" for="player-password">Senha</label>
      <input id="player-password" name="senha" type="password" required autocomplete="current-password"
        class="w-full rounded-lg border border-dungeon-700 bg-dungeon-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-amberGold-500">
      <p id="login-message" role="status" class="min-h-5 text-xs text-rose-300"></p>
      <button id="login-button" type="submit"
        class="w-full rounded-lg bg-amberGold-600 py-2 text-sm font-bold text-black transition hover:bg-amberGold-500">Entrar</button>
      <button id="create-account-button" type="button"
        class="w-full rounded-lg border border-dungeon-700 py-2 text-xs text-slate-300 transition hover:border-amberGold-500 hover:text-amberGold-300">Criar conta</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('login-message');

    async function autenticar(criarSeNaoExistir) {
      const nome = document.getElementById('player-name').value.trim();
      const senha = document.getElementById('player-password').value;
      message.textContent = 'Conectando...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, senha, criarSeNaoExistir }),
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          message.textContent = result.message || 'Não foi possível entrar.';
          return;
        }

        sessionStorage.setItem('rpg_player', result.player);
        sessionStorage.setItem('rpg_token', result.token);
        sessionStorage.removeItem('rpg_character');
        sessionStorage.removeItem('rpg_character_name');
        window.location.assign('/selecao');
      } catch (error) {
        message.textContent = 'Não foi possível conectar ao servidor.';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      autenticar(false);
    });
    document.getElementById('create-account-button').addEventListener('click', () => {
      autenticar(true);
    });
  </script>
</body>
</html>
